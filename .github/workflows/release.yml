name: Release

# Builds Windows (NSIS) and Linux (AppImage + deb) installers and attaches them to a
# GitHub Release. macOS is intentionally not built — see ADR-0003
# (docs/adr/0003-packaging-and-code-signing-approach.md): macOS notifications require a
# code-signed build, and the owner does not use macOS, so there is no signing certificate
# and no macOS runner in this matrix.
#
# There is no dedicated "electron-builder" GitHub Action to pin — the current first-party
# guidance (https://www.electron.build/docs/features/github-actions/, checked 2026-09-22)
# runs electron-builder directly via `npx electron-builder`. That avoids depending on a
# third-party Action whose name/ownership has moved before.
#
# Version is computed by GitVersion from git history (GitVersion.yml, repo root), not hand-
# maintained in package.json — see docs/architecture/packaging-release.md for the full
# rationale and docs/adr (GitVersion decision) for why `GitHubFlow/v1` was chosen. The
# `gittools/actions/gitversion/*` actions (org GitTools, the maintainers of GitVersion itself)
# are pinned to the real, verified tag `v4.7.0`
# (https://github.com/GitTools/actions/releases/tag/v4.7.0, checked 2026-09-22) — same
# "verify the pin actually exists" discipline as the electron-builder decision above, after
# this project already got burned once by a moved/forked Action.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-flag: --win
          - os: ubuntu-latest
            build-flag: --linux -c.productName=GoogleChatDesktop
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion needs full history (all commits + all tags) to walk back to the last
          # version source. actions/checkout defaults to a shallow clone (fetch-depth: 1),
          # which makes GitVersion fail outright or compute a nonsense/zero version — this is
          # the single most common GitVersion-in-CI mistake, so it is called out here rather
          # than left implicit.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.8.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        # Exports both `${{ steps.gitversion.outputs.<name> }}` and `GitVersion_<Name>` env vars
        # (GitVersion_SemVer, GitVersion_FullSemVer, GitVersion_ShortSha, GitVersion_BranchName).
        # scripts/build.js reads the env vars, so GitVersion is not re-run in the same job.

      - name: Build and publish (tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        # scripts/build.js is the single packaging entry point (same one `npm run dist` uses
        # locally). In CI it reads the GitVersion_* variables exported by the step above - GitVersion
        # is not run a second time - writes build-info.json, and passes the GitVersion SemVer to
        # electron-builder as -c.extraMetadata.version. That one value lands in the installer/deb/
        # AppImage names, latest*.yml, the Windows file version and app.getVersion(); the build
        # fails if any produced artifact name or latest*.yml lacks it. Tag v0.1.0 => 0.1.0.
        run: node scripts/build.js ${{ matrix.build-flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only (manual run, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/build.js ${{ matrix.build-flag }} --publish never

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: google-chat-desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore
