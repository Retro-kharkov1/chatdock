<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 10 100 100" width="100" height="100">
  <title>Google Chat Desktop — tray-optimized mark (tight crop, heavier ring/nucleus for legibility at 16px)</title>
  <defs>
    <clipPath id="bubble-clip-tray">
      <rect x="20" y="16" width="84" height="72" rx="20" ry="20" />
    </clipPath>
  </defs>

  <g fill="#149960">
    <rect x="20" y="16" width="84" height="72" rx="20" ry="20" />
    <path d="
      M 50 70
      C 41 83 27 91 13 104
      C 22 92 32 83 40 75
      C 44 71 48 67 50 70
      Z" />
  </g>

  <g clip-path="url(#bubble-clip-tray)">
    <ellipse
      cx="60" cy="50" rx="32" ry="24"
      transform="rotate(-18 60 50)"
      fill="none" stroke="#FFFFFF" stroke-width="12.5" />
  </g>

  <circle cx="60" cy="50" r="8.5" fill="#FFFFFF" />
</svg>
